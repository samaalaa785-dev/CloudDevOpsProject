apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ivolve-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/samaalaa785-dev/CloudDevOpsProject.git
    targetRevision: main
    path: Kubernetes
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: ivolve

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
